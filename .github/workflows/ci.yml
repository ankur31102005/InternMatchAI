name: InternMatch AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Backend CI ──────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Lint/format only needs ruff + black (static checks), not the app deps —
      # installing the full requirements here just made CI slow and flaky.
      - name: Run Backend Lint / Format Check
        run: |
          # Pin versions so a new ruff/black release can't spontaneously
          # break CI with newly-added default rules.
          pip install black==26.5.1 ruff==0.15.22
          ruff check backend/app
          black --check backend/app

  # ── AI Service CI ───────────────────────────────────────────
  ai-service-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Lint/format only needs ruff + black (static checks), not torch /
      # sentence-transformers — installing those made this job slow and flaky.
      - name: Run AI Service Lint / Format Check
        run: |
          # Pin versions so a new ruff/black release can't spontaneously
          # break CI with newly-added default rules.
          pip install black==26.5.1 ruff==0.15.22
          ruff check ai-service/app
          black --check ai-service/app

  # ── Frontend CI ─────────────────────────────────────────────
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Lint & Build
        run: |
          cd frontend
          npm run lint --if-present
          npm run build --if-present
